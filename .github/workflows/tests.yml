name: tests

on:
  push:
  pull_request:

jobs:
  velocity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The velocity tests need only the light dependencies; torch/scanpy
      # are imported lazily by pysce.score and are not exercised here.
      - run: pip install numpy scipy pandas anndata scikit-learn pytest
      - run: python -m pytest -q tests
